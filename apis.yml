aid: alt
name: Alt
description: 'Alt (alt.xyz) is an alternative-asset platform for high-value graded
  trading cards, founded by Leore Avidar, who previously co-founded the address and
  print API company Lob. Alt lets collectors and investors research, value, buy, sell,
  vault, and borrow against slabbed cards in one place, spanning baseball, basketball,
  football, hockey, soccer, golf, tennis, racing and combat-sports cards as well as
  Pokemon and other trading-card games. The platform combines a fixed-price marketplace,
  timed and "Liquid" auctions, an Instant Pricer, market-trend and research views,
  a physical vault in Delaware that removes sales tax from transactions, and card-backed
  lending. Its pricing engine, Alt Value, is a machine-learning model tuned by card-pricing
  specialists that produces a real-time value for every BGS, PSA and SGC card vaulted
  with Alt, and that value underwrites every trade, loan and product on the platform.
  Alt raised a $75M Series B in November 2021 led by Spearhead with Seven Seven Six
  and a group of professional athletes. Alt publishes no public developer program:
  there is no developer portal, API reference, OpenAPI definition, SDK, CLI, sandbox
  or self-service API signup. Its programmatic surface is the private backend behind
  the alt.xyz web and mobile applications (a FastAPI/GraphQL platform service, with
  the engineering organisation on GitHub as github.com/onlyalt), which integrates payment,
  identity-verification, authentication, lending-servicing and shipping vendors but
  is neither documented nor offered to third parties.'
